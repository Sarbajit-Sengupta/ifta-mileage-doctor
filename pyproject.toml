[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ifta-mileage-doctor"
version = "1.0.0"
description = "Offline IFTA quarterly return CLI from trip, fuel, and rates JSON files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
ifta-mileage-doctor = "ifta_mileage_doctor:main"

[tool.setuptools]
py-modules = ["ifta_mileage_doctor"]
